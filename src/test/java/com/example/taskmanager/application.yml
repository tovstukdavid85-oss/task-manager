port: 8080    # На каком порту слушать HTTP-запросы
  # http://localhost:8080/api/tasks

# ==========================================
# НАСТРОЙКИ SPRING
# ==========================================
spring:

  # --- Подключение к базе данных ---
  datasource:
    url: jdbc:postgresql://localhost:5432/task_manager
    # jdbc:postgresql:// = "протокол подключения"
    # localhost:5432 = адрес PostgreSQL (из docker-compose)
    # task_manager = имя базы данных

    username: postgres      # Логин (из docker-compose)
    password: postgres      # Пароль (из docker-compose)
    driver-class-name: org.postgresql.Driver
    # "Переводчик" —告诉 Spring КАК говорить с PostgreSQL

  # --- Настройки Hibernate (JPA) ---
  jpa:
    hibernate:
      ddl-auto: validate
      # auto = Hibernate сам создаёт/изменяет таблицы (опасно!)
      # validate = только ПРОВЕРЯЕТ что таблицы совпадают с кодом
      # CREATE TABLE делает Liquibase, а не Hibernate
    show-sql: true          # Показывать SQL в консоли (для отладки)
    properties:
      hibernate:
        format_sql: true    # Красиво форматировать SQL
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # "Диалект" — PostgreSQL имеет свои особенности SQL

springdoc:
  swagger-ui:
    path: /swagger-ui.html  # Адрес Swagger UI
    tags-sorter: alpha      # Сортировка по алфавиту
    operations-sorter: alpha
  api-docs:
    path: /api-docs         # Адрес JSON-описания API